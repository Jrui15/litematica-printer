import groovy.json.JsonSlurper

pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Jitpack'
			url = "https://jitpack.io"
		}
		maven {
			name = 'Masa'
			url = "https://masa.dy.fi/maven"
		}
		mavenCentral()
		gradlePluginPortal()
	}
	resolutionStrategy {
		eachPlugin {
			switch (requested.id.id) {
				case "com.replaymod.preprocess": {
					useModule("com.github.Fallen-Breath:preprocessor:${requested.version}")
					break
				}
			}
		}
	}
}

def settings = new JsonSlurper().parseText(file('settings.json').text)
def requestedTasks = gradle.startParameter.taskNames
def explicitlyRequestedModern = gradle.startParameter.taskNames.any { taskName ->
	taskName == ':26.3' || taskName == '26.3' || taskName.startsWith(':26.3:') || taskName.startsWith('26.3:') ||
	taskName == ':26.2' ||
		taskName == '26.2' ||
		taskName.startsWith(':26.2:') ||
		taskName.startsWith('26.2:')
}
def onlyRequestedOtherProjects = !requestedTasks.isEmpty() && requestedTasks.every { taskName ->
	def normalizedTaskName = taskName.startsWith(':') ? taskName.substring(1) : taskName
	normalizedTaskName.contains(':') && !normalizedTaskName.startsWith('26.2:') && !normalizedTaskName.startsWith('26.3:')
}
def aggregateBuildRequested = requestedTasks.isEmpty() || requestedTasks.any { taskName ->
	def normalizedTaskName = taskName.startsWith(':') ? taskName.substring(1) : taskName
	['assemble', 'build', 'check'].contains(normalizedTaskName)
}
for (String version : settings.versions) {
	if (version in ['26.2', '26.3'] && JavaVersion.current() < JavaVersion.VERSION_25) {
		if (onlyRequestedOtherProjects && !explicitlyRequestedModern) {
			println 'Skipping modern project because Minecraft 26.2/26.3 requires running Gradle with Java 25.'
			continue
		}
		if (aggregateBuildRequested || explicitlyRequestedModern) {
			throw new GradleException('Minecraft 26.2/26.3 requires running Gradle with Java 25. Use a Java 25 runtime for :26.2 or :26.3, or request a specific legacy project such as :1.21.5:build with Java 21.')
		}
	}
	include(":$version")

	def proj = project(":$version")
	proj.projectDir = file("versions/$version")
	proj.buildFileName = "../../common.gradle"
}
